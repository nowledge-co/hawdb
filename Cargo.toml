[package]
name = "skein"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skein-core = { path = "crates/core" }
skein-analytics = { path = "crates/analytics" }
skein-cypher = { path = "crates/cypher" }
skein-ddl = { path = "crates/ddl" }
skein-evidence = { path = "crates/evidence" }
skein-executor = { path = "crates/executor" }
skein-expression = { path = "crates/expression" }
skein-integrity = { path = "crates/integrity" }
skein-optimizer = { path = "crates/optimizer" }
skein-plan = { path = "crates/plan" }
skein-plan-cache = { path = "crates/plan-cache" }
skein-qos = { path = "crates/qos" }
skein-query = { path = "crates/query" }
skein-readiness = { path = "crates/readiness" }
skein-relational = { path = "crates/relational" }
skein-route-ownership = { path = "crates/route-ownership" }
skein-search = { path = "crates/search", default-features = false }
skein-runtime-tokio = { path = "crates/runtime-tokio", optional = true }
skein-sql = { path = "crates/sql" }
skein-storage = { path = "crates/storage" }
skein-vector-projection = { path = "crates/vector-projection", optional = true }
zstd = "0.13"
unicode-width = "0.2"
skein-telemetry = { path = "crates/telemetry" }

[dev-dependencies]
libc = "0.2"
loom = "0.7"

[features]
default = [
  "background-maintenance",
  "full-text-search",
  "graph-analytics",
  "vector-search",
]
acl = ["skein-search/acl"]
background-maintenance = ["skein-search/background-maintenance"]
full-text-search = ["skein-search/full-text-search"]
graph-analytics = ["skein-search/graph-analytics"]
vector-search = ["skein-search/vector-search", "dep:skein-vector-projection"]
loom-tests = []
opentelemetry = ["skein-telemetry/opentelemetry"]
qualification = ["skein-search/qualification"]
tokio-runtime = ["dep:skein-runtime-tokio"]

[workspace]
members = [
  "crates/analytics",
  "crates/core",
  "crates/cypher",
  "crates/ddl",
  "crates/evidence",
  "crates/executor",
  "crates/expression",
  "crates/fuzz",
  "crates/cgroup",
  "crates/integrity",
  "crates/optimizer",
  "crates/plan",
  "crates/plan-cache",
  "crates/qos",
  "crates/query",
  "crates/qualification",
  "crates/readiness",
  "crates/relational",
  "crates/route-ownership",
  "crates/search",
  "crates/sql",
  "crates/sql-syntax",
  "crates/storage",
  "crates/telemetry",
  "crates/runtime-tokio",
  "crates/vector-projection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
lto = false
incremental = true
panic = "unwind"
debug-assertions = true
overflow-checks = true
rpath = false

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
panic = "unwind"
debug-assertions = false
overflow-checks = false
rpath = false

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

