[package]
name = "skein"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
regex = "1"
serde = "1"
serde_json = "1"
skein-core = { path = "crates/core" }
skein-api-types = { path = "crates/api-types" }
skein-cypher = { path = "crates/cypher" }
skein-optimizer = { path = "crates/optimizer" }
skein-plan-cache = { path = "crates/plan-cache" }
skein-qos = { path = "crates/qos" }
zstd = "0.13"
turbovec = { version = "0.9.0", optional = true }

[features]
default = []
turbovec = ["dep:turbovec"]

[workspace]
members = [
  "crates/api-types",
  "crates/core",
  "crates/cypher",
  "crates/optimizer",
  "crates/plan-cache",
  "crates/qos",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bench]]
name = "optimizer_smoke"
harness = false
