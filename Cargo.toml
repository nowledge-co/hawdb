[package]
name = "skein"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jieba-rs = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simsimd = "6.5"
skein-core = { path = "crates/core" }
skein-api-types = { path = "crates/api-types" }
skein-cypher = { path = "crates/cypher" }
skein-ddl = { path = "crates/ddl" }
skein-executor = { path = "crates/executor" }
skein-expression = { path = "crates/expression" }
skein-integrity = { path = "crates/integrity" }
skein-optimizer = { path = "crates/optimizer" }
skein-plan = { path = "crates/plan" }
skein-plan-cache = { path = "crates/plan-cache" }
skein-qos = { path = "crates/qos" }
skein-query = { path = "crates/query" }
skein-readiness = { path = "crates/readiness" }
skein-route-ownership = { path = "crates/route-ownership" }
skein-runtime-tokio = { path = "crates/runtime-tokio", optional = true }
skein-sql = { path = "crates/sql" }
skein-storage = { path = "crates/storage" }
skein-vector-projection = { path = "crates/vector-projection", optional = true }
zstd = "0.13"
unicode-width = "0.2"
loom = { version = "0.7", optional = true }
skein-telemetry = { path = "crates/telemetry" }

[features]
default = [
  "background-maintenance",
  "full-text-search",
  "graph-analytics",
  "vector-search",
]
acl = []
background-maintenance = []
full-text-search = []
graph-analytics = []
vector-search = ["dep:skein-vector-projection"]
loom-tests = ["dep:loom"]
opentelemetry = ["skein-telemetry/opentelemetry"]
qualification = []
tokio-runtime = ["dep:skein-runtime-tokio"]

[workspace]
members = [
  "crates/api-types",
  "crates/core",
  "crates/cypher",
  "crates/ddl",
  "crates/executor",
  "crates/expression",
  "crates/fuzz",
  "crates/cgroup",
  "crates/integrity",
  "crates/optimizer",
  "crates/plan",
  "crates/plan-cache",
  "crates/qos",
  "crates/query",
  "crates/qualification",
  "crates/readiness",
  "crates/route-ownership",
  "crates/sql",
  "crates/storage",
  "crates/telemetry",
  "crates/runtime-tokio",
  "crates/vector-projection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
lto = false
incremental = true
panic = "unwind"
debug-assertions = true
overflow-checks = false
rpath = false

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
panic = "unwind"
debug-assertions = false
overflow-checks = false
rpath = false

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[[bench]]
name = "optimizer_smoke"
harness = false

[[bench]]
name = "store_cow_feasibility"
harness = false

[[bench]]
name = "executor_vectorization"
harness = false

[[bench]]
name = "integrity_checksum"
harness = false

[[bench]]
name = "search_checkpoint"
harness = false

[[bench]]
name = "search_generation"
harness = false

[[bench]]
name = "storage_segment_read"
harness = false

[[bench]]
name = "vector_projection_scan"
harness = false

[[bench]]
name = "aggregate_partial_spill"
harness = false

[[bench]]
name = "relational_overflow"
harness = false

[[bench]]
name = "relational_index_access"
harness = false
