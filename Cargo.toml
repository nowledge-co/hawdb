[package]
name = "hawdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "crates/core" }
hawdb-bootstrap = { path = "crates/bootstrap" }
hawdb-artifact = { path = "crates/artifact" }
hawdb-compat = { path = "crates/compat" }
hawdb-nowledge-contracts = { path = "crates/nowledge-contracts" }
hawdb-analytics = { path = "crates/analytics" }
hawdb-cypher = { path = "crates/cypher" }
hawdb-ddl = { path = "crates/ddl" }
hawdb-evidence = { path = "crates/evidence" }
hawdb-explain = { path = "crates/explain" }
hawdb-executor = { path = "crates/executor" }
hawdb-expression = { path = "crates/expression" }
hawdb-fuzz-contracts = { path = "crates/fuzz-contracts" }
hawdb-integrity = { path = "crates/integrity" }
hawdb-optimizer = { path = "crates/optimizer" }
hawdb-plan = { path = "crates/plan" }
hawdb-plan-cache = { path = "crates/plan-cache" }
hawdb-qos = { path = "crates/qos" }
hawdb-query = { path = "crates/query" }
hawdb-query-policy = { path = "crates/query-policy" }
hawdb-readiness = { path = "crates/readiness" }
hawdb-relational = { path = "crates/relational" }
hawdb-resource-profile = { path = "crates/resource-profile" }
hawdb-route-ownership = { path = "crates/route-ownership" }
hawdb-search = { path = "crates/search", default-features = false }
hawdb-runtime-tokio = { path = "crates/runtime-tokio", optional = true }
hawdb-sql = { path = "crates/sql" }
hawdb-storage = { path = "crates/storage" }
hawdb-system-sql = { path = "crates/system-sql" }
hawdb-vector-projection = { path = "crates/vector-projection", optional = true }
zstd = "0.13"
unicode-width = "0.2"
hawdb-telemetry = { path = "crates/telemetry" }

[dev-dependencies]
libc = "0.2"
hawdb-storage = { path = "crates/storage", features = ["test-support"] }

[features]
default = [
  "background-maintenance",
  "full-text-search",
  "graph-analytics",
  "tokio-runtime",
  "vector-search",
]
acl = ["hawdb-search/acl"]
background-maintenance = ["hawdb-search/background-maintenance"]
full-text-search = ["hawdb-search/full-text-search"]
graph-analytics = ["hawdb-search/graph-analytics"]
vector-search = ["hawdb-search/vector-search", "dep:hawdb-vector-projection"]
loom-tests = ["hawdb-system-sql/loom-tests"]
opentelemetry = ["hawdb-telemetry/opentelemetry"]
qualification = ["hawdb-search/qualification"]
test-support = ["hawdb-storage/test-support"]
tokio-runtime = ["dep:hawdb-runtime-tokio"]

[workspace]
members = [
  "crates/analytics",
  "crates/bootstrap",
  "crates/artifact",
  "crates/compat",
  "crates/nowledge-contracts",
  "crates/core",
  "crates/cypher",
  "crates/ddl",
  "crates/evidence",
  "crates/explain",
  "crates/executor",
  "crates/expression",
  "crates/fuzz-contracts",
  "crates/fuzz",
  "crates/cgroup",
  "crates/cascades",
  "crates/integrity",
  "crates/optimizer",
  "crates/plan",
  "crates/plan-cache",
  "crates/qos",
  "crates/query",
  "crates/query-policy",
  "crates/qualification",
  "crates/readiness",
  "crates/relational",
  "crates/resource-profile",
  "crates/route-ownership",
  "crates/search",
  "crates/sql",
  "crates/sql-syntax",
  "crates/storage",
  "crates/system-sql",
  "crates/telemetry",
  "crates/runtime-tokio",
  "crates/vector-projection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
lto = false
incremental = true
panic = "unwind"
debug-assertions = true
overflow-checks = true
rpath = false

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
panic = "unwind"
debug-assertions = false
overflow-checks = false
rpath = false

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

