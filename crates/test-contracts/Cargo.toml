[package]
name = "hawdb-test-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Unpublished fixtures and external checkpoint contracts for HawDB"

[features]
default = ["full"]
full = ["hawdb/default"]

[dev-dependencies]
hawdb = { path = "../..", default-features = false, features = ["builtin-zstd"] }
hawdb-storage = { path = "../storage", features = ["test-support"], default-features = false }

[[test]]
name = "checkpoint_contracts"
path = "tests/checkpoint_contracts.rs"
