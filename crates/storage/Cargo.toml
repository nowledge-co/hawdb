[package]
name = "hawdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Test fixtures only; deliberately absent from default library dependencies.
test-zstd = ["dep:zstd"]
test-support = []
# Optional bridge for counted native artifact mappings; portable hosts omit it.
artifact-mmap = ["dep:memmap2"]

[dependencies]
rayon = "1.11"
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core", version = "0.40.0" }
hawdb-integrity = { path = "../integrity", version = "0.40.0" }
hawdb-analytics = { path = "../analytics", version = "0.40.0" }
hawdb-telemetry = { path = "../telemetry", version = "0.40.0" }
hawdb-qos = { path = "../qos", version = "0.40.0" }
zstd = { version = "0.14.3", optional = true }
memmap2 = { version = "0.9.11", optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
fs2 = "0.4.3"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[[bench]]
name = "strict_append_prepare"
harness = false

[[bench]]
name = "projection_label_source"
harness = false

[[bench]]
name = "graph_checkpoint_carry"
harness = false

[[bench]]
name = "wal_batch_encode"
harness = false

[dev-dependencies]
zstd = "0.14.3"
