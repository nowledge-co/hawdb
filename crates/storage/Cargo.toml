[package]
name = "hawdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-support = []
# Optional bridge for counted native artifact mappings; portable hosts omit it.
artifact-mmap = ["dep:memmap2"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.11"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core", version = "0.6.0" }
hawdb-integrity = { path = "../integrity", version = "0.6.0" }
hawdb-analytics = { path = "../analytics", version = "0.6.0" }
hawdb-telemetry = { path = "../telemetry", version = "0.6.0" }
hawdb-plan-cypher = { path = "../plan-cypher", version = "0.6.0" }
hawdb-qos = { path = "../qos", version = "0.6.0" }
zstd = "0.13"
memmap2 = { version = "0.9.11", optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
fs2 = "0.4.3"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"
