[package]
name = "hawdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-support = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.11"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core", version = "0.3.0" }
hawdb-integrity = { path = "../integrity", version = "0.3.0" }
hawdb-analytics = { path = "../analytics", version = "0.3.0" }
hawdb-telemetry = { path = "../telemetry", version = "0.3.0" }
hawdb-plan = { path = "../plan", version = "0.3.0" }
hawdb-qos = { path = "../qos", version = "0.3.0" }
zstd = "0.13"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
fs2 = "0.4.3"
