[package]
name = "hawdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4.3"
rayon = "1.11"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core" }
hawdb-integrity = { path = "../integrity" }
hawdb-analytics = { path = "../analytics" }
hawdb-telemetry = { path = "../telemetry" }
hawdb-plan = { path = "../plan" }
hawdb-qos = { path = "../qos" }
zstd = "0.13"
