[package]
name = "hawdb-vector-projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Standalone vector consumers keep their existing small dependency surface.
# Embedded search enables the shared storage admission and file operations.
storage-io = ["dep:hawdb-storage", "hawdb-storage/artifact-mmap"]

[dependencies]
crc32fast = "1"
memmap2 = "0.9.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core", version = "0.5.0" }
hawdb-storage = { path = "../storage", version = "0.5.0", optional = true }
