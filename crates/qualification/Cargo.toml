[package]
name = "hawdb-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
hawdb = { path = "../..", default-features = false, features = ["full-text-search", "tokio-runtime", "vector-search"] }
hawdb-query = { path = "../query" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[features]
default = []

[[bin]]
name = "hawdb-soak"
path = "src/main.rs"

[[bin]]
name = "hawdb-qualification-bundle"
path = "src/bin/release_bundle.rs"

[[bin]]
name = "hawdb-content-store-contract"
path = "src/bin/content_store_contract.rs"

[[bin]]
name = "hawdb-content-store-memory-qualification"
path = "src/bin/content_store_memory_qualification.rs"

[[bin]]
name = "hawdb-content-store-read-qualification"
path = "src/bin/content_store_read_qualification.rs"

[[bin]]
name = "hawdb-content-store-mutation-qualification"
path = "src/bin/content_store_mutation_qualification.rs"

[[bin]]
name = "hawdb-content-store-overflow-compaction-qualification"
path = "src/bin/content_store_overflow_compaction_qualification.rs"

[[bin]]
name = "hawdb-graph-index-qualification"
path = "src/bin/graph_index_qualification.rs"

[[bin]]
name = "hawdb-graph-storage-qualification"
path = "src/bin/graph_storage_qualification.rs"

# The aarch64 hardware SHA-256 backend is only reachable through this feature;
# x86 already detects SHA-NI at runtime and needs nothing here. `sha2-asm`
# ships GNU-syntax `.S` sources, which MSVC cannot assemble, so the activation
# excludes that environment rather than the whole platform.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["asm"] }
