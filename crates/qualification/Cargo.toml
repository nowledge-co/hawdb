[package]
name = "skein-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
skein = { path = "../..", default-features = false, features = ["full-text-search", "tokio-runtime", "vector-search"] }
skein-query = { path = "../query" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
turbovec = { version = "0.9.0", optional = true }

[features]
default = []
turbovec-oracle = ["dep:turbovec", "skein/qualification"]

[[bin]]
name = "skein-soak"
path = "src/main.rs"

[[bin]]
name = "skein-qualification-bundle"
path = "src/bin/release_bundle.rs"

[[bin]]
name = "skein-content-store-contract"
path = "src/bin/content_store_contract.rs"
