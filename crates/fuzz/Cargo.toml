[package]
name = "hawdb-fuzz"
default-run = "hawdb-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
serde_json = "1"
hawdb = { path = "../..", version = "0.3.0", default-features = false }
hawdb-fuzz-contracts = { path = "../fuzz-contracts", version = "0.3.0" }

[features]
default = [
    "background-maintenance",
    "full-text-search",
    "graph-analytics",
    "vector-search",
]
acl = ["hawdb/acl"]
background-maintenance = ["hawdb/background-maintenance"]
full-text-search = ["hawdb/full-text-search"]
graph-analytics = ["hawdb/graph-analytics"]
qualification = ["hawdb/qualification"]
vector-search = ["hawdb/vector-search"]

[[bin]]
name = "hawdb-fuzz"
path = "src/main.rs"

[[bin]]
name = "hawdb-storage-fuzz"
path = "src/storage_main.rs"

[[bin]]
name = "hawdb-append-fuzz"
path = "src/append_main.rs"

[[bin]]
name = "hawdb-parser-fuzz"
path = "src/parser_main.rs"
