[package]
name = "skein-fuzz"
default-run = "skein-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
skein = { path = "../..", default-features = false }

[features]
default = [
    "background-maintenance",
    "full-text-search",
    "graph-analytics",
    "vector-search",
]
acl = ["skein/acl"]
background-maintenance = ["skein/background-maintenance"]
full-text-search = ["skein/full-text-search"]
graph-analytics = ["skein/graph-analytics"]
qualification = ["skein/qualification"]
vector-search = ["skein/vector-search"]

[[bin]]
name = "skein-fuzz"
path = "src/main.rs"

[[bin]]
name = "skein-storage-fuzz"
path = "src/storage_main.rs"

[[bin]]
name = "skein-append-fuzz"
path = "src/append_main.rs"

[[bin]]
name = "skein-parser-fuzz"
path = "src/parser_main.rs"
