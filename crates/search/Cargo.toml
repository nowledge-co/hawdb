[package]
name = "hawdb-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bitpacking = { version = "=0.9.3", default-features = false, features = ["bitpacker4x"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Opaque analyzer capacity bounds are qualified against this dependency set.
jieba-rs = "=0.10.3"
regex = { version = "=1.13.1", default-features = false }
regex-automata = { version = "=0.4.16", default-features = false }
regex-syntax = { version = "=0.8.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simsimd = { version = "6.5", optional = true }
zstd = "0.13"
hawdb-core = { path = "../core" }
hawdb-evidence = { path = "../evidence" }
hawdb-executor = { path = "../executor" }
hawdb-integrity = { path = "../integrity" }
hawdb-optimizer = { path = "../optimizer" }
hawdb-plan = { path = "../plan" }
hawdb-qos = { path = "../qos" }
hawdb-storage = { path = "../storage" }
hawdb-telemetry = { path = "../telemetry" }
hawdb-vector-projection = { path = "../vector-projection", optional = true }

[features]
default = [
    "background-maintenance",
    "full-text-search",
    "graph-analytics",
    "vector-search",
]
acl = []
background-maintenance = []
full-text-search = []
graph-analytics = []
qualification = []
vector-search = ["dep:simsimd", "dep:hawdb-vector-projection"]

[dev-dependencies]
hawdb-vector-projection = { path = "../vector-projection" }
