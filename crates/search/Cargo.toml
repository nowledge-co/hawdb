[package]
name = "hawdb-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bitpacking = { version = "=0.9.3", default-features = false, features = ["bitpacker4x"] }
fst = "=0.4.7"
# Opaque analyzer capacity bounds are qualified against this dependency set.
jieba-rs = { version = "=0.11.0", default-features = false }
regex = { version = "=1.13.1", default-features = false }
regex-automata = { version = "=0.4.19", default-features = false }
regex-syntax = { version = "=0.8.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hawdb-core = { path = "../core", version = "0.40.0" }
hawdb-evidence = { path = "../evidence", version = "0.40.0" }
hawdb-executor = { path = "../executor", version = "0.40.0" }
hawdb-integrity = { path = "../integrity", version = "0.40.0" }
hawdb-cascades = { path = "../cascades", version = "0.40.0" }
hawdb-optimizer-predicate = { path = "../optimizer-predicate", version = "0.40.0" }
hawdb-optimizer-vector = { path = "../optimizer-vector", version = "0.40.0" }
hawdb-plan-core = { path = "../plan-core", version = "0.40.0" }
hawdb-qos = { path = "../qos", version = "0.40.0" }
hawdb-storage = { path = "../storage", version = "0.40.0", default-features = false }
hawdb-telemetry = { path = "../telemetry", version = "0.40.0" }
hawdb-vector-projection = { path = "../vector-projection", version = "0.40.0", optional = true }

[features]
test-zstd = ["hawdb-storage/test-zstd"]
default = [
    "background-maintenance",
    "full-text-search",
    "graph-analytics",
    "vector-search",
]
acl = []
background-maintenance = []
full-text-search = []
graph-analytics = []
qualification = []
vector-search = ["dep:hawdb-vector-projection", "hawdb-vector-projection/storage-io"]

[dev-dependencies]
zstd = "0.14.3"
hawdb-storage = { path = "../storage", version = "0.40.0", default-features = false, features = ["test-zstd"] }
hawdb-vector-projection = { path = "../vector-projection", version = "0.40.0" }
