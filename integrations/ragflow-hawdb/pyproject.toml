[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[project]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "hawdb>=0.36.0",
  # RAGFlow v0.27.3 locks networkx 3.6.1; CI tests that release.
  "networkx>=3.0",
]
description = "RAGFlow GraphRAG graph store for the embedded HawDB database"
license = "Apache-2.0"
name = "ragflow-hawdb"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.urls]
Repository = "https://github.com/nowledge-co/hawdb"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.sdist]
include = ["ragflow_hawdb/", "tests/", "patches/", "README.md"]

[tool.hatch.build.targets.wheel]
include = ["ragflow_hawdb/"]
