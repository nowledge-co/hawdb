[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[project]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "hawdb>=0.28.0",
  # GraphStore and GraphDocument live in langchain-community; CI tests 0.4.2.
  "langchain-community>=0.4.2,<0.5",
]
description = "LangChain graph store for the embedded HawDB database"
license = "Apache-2.0"
name = "langchain-hawdb"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.urls]
Repository = "https://github.com/nowledge-co/hawdb"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.sdist]
include = ["langchain_hawdb/", "tests/", "README.md"]

[tool.hatch.build.targets.wheel]
include = ["langchain_hawdb/"]
