# The plugin daemon installs [project].dependencies with `uv sync --no-dev`,
# or requirements.txt when a pip mirror is configured; keep both lists equal.
# There is no build system: Dify runs the plugin from its package directory,
# and uv installs only the dependencies of a project without one.
[project]
dependencies = ["dify_plugin>=0.11.0,<0.12.0", "hawdb>=0.31.0"]
name = "dify-plugin-hawdb"
requires-python = ">=3.12"
version = "0.1.0"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
# anyio's pytest plugin imports ssl before dify_plugin patches the standard
# library for gevent, which the plugin process never does.
addopts = ["-p", "no:anyio"]
# A handle freed on another thread than its own is an unraisable error.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
testpaths = ["tests"]
