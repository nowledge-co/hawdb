# Dify plugin manifest. `meta.version` is the manifest specification version
# that `dify plugin init` writes (plugin daemon 0.6.15); the runner matches
# the Python version that dify_plugin 0.11 requires.
version: 0.1.0
type: plugin
author: nowledge
name: hawdb
repo: https://github.com/nowledge-co/hawdb
label:
  en_US: HawDB
  zh_Hans: HawDB
description:
  en_US: Run parameterized Cypher and SQL against an embedded HawDB database, and retrieve from it through Dify's external knowledge API.
  zh_Hans: 对嵌入式 HawDB 数据库执行参数化 Cypher 和 SQL，并通过 Dify 外部知识库 API 从中检索。
icon: icon.svg
created_at: 2026-11-14T00:00:00Z
resource:
  memory: 268435456
  permission:
    endpoint:
      enabled: true
plugins:
  tools:
    - provider/hawdb.yaml
  endpoints:
    - group/hawdb.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
privacy: PRIVACY.md
