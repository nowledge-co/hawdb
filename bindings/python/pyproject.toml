[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

[project]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
description = "HawDB Python bindings"
license = "Apache-2.0"
name = "hawdb"
readme = "README.md"
requires-python = ">=3.11"

dynamic = ["version"]

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]

[project.urls]
Repository = "https://github.com/nowledge-co/hawdb"

[dependency-groups]
dev = ["maturin>=1.8"]
test = ["pytest>=8.0"]

[tool.maturin]
features = ["pyo3/extension-module", "abi3"]
module-name = "hawdb._hawdb"
python-source = "python"

[tool.uv]
package = false
