[header]
builtin = "Apache-2.0"

[props]
copyright_owner = "Nowledge"
inception_year = 2026

[files]
excludes = [
    "**/*.toml",
    "**/*.yml",
    "**/*.yaml",
    "**/*.json",
    "**/*.lock",
    "**/*.sql",
    "**/BUILD.bazel",
    "**/*.bzl",
    # Preserve source-bound benchmark evidence, including raw JUnit XML and
    # reproduction snapshots whose bytes are recorded by historical manifests.
    "docs/benchmarks/**",
    # The golden logical dump's bytes are pinned by the SHA-256 values in its
    # own manifest; every later release must import them unchanged.
    "tests/logical_dump/golden_v1/**",
    # Compiler output and downloaded MoonBit dependencies are not project source.
    "**/target/**",
    "**/_build/**",
    "**/.mooncakes/**",
    "examples/wasm-playground/pkg/**",
]

[[rules]]
# Keep Go headers compatible with gofmt and separate from build constraints.
extensions = ["go"]
style_out = "doubleslash"
styles_in = ["doubleslash", "slashstar"]

[[rules]]
extensions = ["mbt", "mbti"]
filenames = ["moon.mod", "moon.pkg"]
style_out = "doubleslash"
