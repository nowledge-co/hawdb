version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /bindings/python
      - /experiments/cypher-yacc
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    ignore:
      # This module is owned locally through local_path_override.
      - dependency-name: rules_tla
    groups:
      bazel-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    ignore:
      # Rust pins in Cargo, Bazel and CI are updated together.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
