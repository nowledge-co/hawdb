name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check advisories licenses

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check scripts
        run: |
          bash -n scripts/nowledge-previous-wrapper-preflight.sh
          bash -n scripts/check-storage-tla.sh
          test "$(scripts/check-storage-tla.sh --manifest-json 4ebf76c | jq -r .source_revision)" = "4ebf76c"

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  storage-formal-models:
    name: Storage Formal Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-storage-tla

      - name: Check storage TLA+ models with Bazel
        # Each TLC process already parallelizes internally. Serial Bazel action
        # scheduling prevents a runner from multiplying that worker count by
        # the number of models in the suite.
        run: bazel test //docs/tla:storage_models --jobs=1 --test_output=errors

      - name: Check storage TLA+ negative controls
        run: scripts/check-storage-tla.sh --check-mutants

      # rules_tla is the authoritative model-check gate. The release artifact
      # collector repeats the bounded checks only because the published
      # evidence contract retains complete TLC logs, while rules_tla 0.2.0
      # exposes a success marker but not the action log as a declared output.
      - name: Collect storage model-check evidence
        env:
          TLA_RESULTS_DIR: ${{ github.workspace }}/tla-results
          TLA_SOURCE_REVISION: ${{ github.sha }}
        run: scripts/check-storage-tla.sh

      - name: Upload storage model-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-model-check-${{ github.sha }}
          path: tla-results
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Test
        run: cargo test --workspace

      - name: Append storage fuzz smoke
        run: |
          cargo run -p skein-fuzz --bin skein-append-fuzz -- --seed 7 --cases 8 --steps 64
          cargo run -p skein-fuzz --bin skein-storage-fuzz -- --seed 7 --cases 32

      - name: Optimizer smoke summary gate
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cargo test --benches --quiet > "$root/optimizer-smoke.out"
          python3 - "$root/optimizer-smoke.out" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              lines = file.readlines()

          prefix = "optimizer_smoke_summaries_json "
          matches = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          assert len(matches) == 1, f"expected one {prefix.strip()} line, found {len(matches)}"

          summaries = json.loads(matches[0])
          assert isinstance(summaries, list) and summaries, "optimizer smoke summaries must be a non-empty array"

          required_fields = {
              "case",
              "groups",
              "rows",
              "cost",
              "operator_counts",
              "class_counts",
              "fingerprint",
          }
          for summary in summaries:
              missing = required_fields - set(summary)
              assert not missing, f"{summary.get('case', '<unknown>')} missing fields: {sorted(missing)}"
              assert isinstance(summary["case"], str) and summary["case"], "case must be a non-empty string"
              assert isinstance(summary["groups"], int) and summary["groups"] > 0, "groups must be positive"
              assert isinstance(summary["rows"], int) and summary["rows"] >= 0, "rows must be non-negative"
              assert isinstance(summary["cost"], (int, float)) and summary["cost"] >= 0, "cost must be non-negative"
              assert isinstance(summary["operator_counts"], dict) and summary["operator_counts"], "operator_counts must be non-empty"
              assert isinstance(summary["class_counts"], dict) and summary["class_counts"], "class_counts must be non-empty"
              assert isinstance(summary["fingerprint"], str) and summary["fingerprint"], "fingerprint must be a non-empty string"
          PY

      - name: Fixture contract checker smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cat > "$root/contract.json" <<'JSON'
          {
            "protocol": "skein-nowledge-fixture-contract",
            "fixture": "mini",
            "check_count": 2,
            "setup": [],
            "checks": [
              {
                "index": 0,
                "kind": "cypher",
                "name": "first",
                "execution_mode": "database",
                "setup": [],
                "statement": {
                  "command_request": {
                    "op": "query",
                    "cypher": "MATCH (n) RETURN n",
                    "parameters": {}
                  }
                },
                "expected_rows": {
                  "kind": "row_count",
                  "count": 1
                }
              },
              {
                "index": 1,
                "kind": "cypher",
                "name": "second",
                "execution_mode": "database",
                "setup": [],
                "statement": {
                  "command_request": {
                    "op": "query",
                    "cypher": "MATCH (n) RETURN n",
                    "parameters": {}
                  }
                },
                "expected_rows": {
                  "kind": "row_count",
                  "count": 0
                }
              }
            ]
          }
          JSON
          cargo run --quiet --bin skein -- \
            nowledge-fixture-contract-command-check \
            --start-check 1 \
            "$root/contract.json" \
            python3 -c 'import json,sys; json.load(sys.stdin); print(json.dumps({"rows": []}))' \
            > "$root/selected.json"
          grep -q '"selected_subset_ready": true' "$root/selected.json"
          grep -q '"full_contract_ready": false' "$root/selected.json"
          grep -q '"full_contract_not_checked"' "$root/selected.json"
          grep -q '"previous_wrapper_contract_evidence"' "$root/selected.json"
          grep -q '"missing_wrapper_identity"' "$root/selected.json"
          if cargo run --quiet --bin skein -- \
            nowledge-fixture-contract-command-check \
            --require-full-contract \
            --start-check 1 \
            "$root/contract.json" \
            python3 -c 'import json,sys; json.load(sys.stdin); print(json.dumps({"rows": []}))' \
            > "$root/full.json" 2> "$root/full.err"; then
            echo "expected selected fixture slice to fail full-contract readiness"
            exit 1
          fi
          grep -q '"selected_subset_ready": true' "$root/full.json"
          grep -q '"required_contract_ready": false' "$root/full.json"
          grep -q '"required_contract_blocker_codes"' "$root/full.json"
          grep -q '"full_contract_not_checked"' "$root/full.json"
          grep -q "fixture contract command check failed" "$root/full.err"

      - name: Storage recovery report smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          TMPDIR="$root" cargo run --quiet --bin skein -- > "$root/demo.out"
          db="$root/skein-demo"
          cargo run --quiet --bin skein -- \
            storage-recovery-report \
            --max-wal-replay-entries 100 \
            --require-durable \
            --require-checkpoint-boundary \
            --require-bounded-wal-replay \
            --require-clean-tail \
            "$db" > "$root/recovery.json"
          grep -q '"protocol": "skein-storage-recovery-report"' "$root/recovery.json"
          grep -q '"durable_recovery_observed": true' "$root/recovery.json"
          grep -q '"checkpoint_boundary_present": true' "$root/recovery.json"
          grep -q '"wal_replay_bounded": true' "$root/recovery.json"
          grep -q '"torn_tail_clean": true' "$root/recovery.json"

      - name: Background maintenance report smoke
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          TMPDIR="$root" cargo run --quiet --bin skein -- > "$root/demo.out"
          db="$root/skein-demo"
          cargo run --quiet --bin skein -- \
            background-maintenance-report \
            --require-cutover-ready \
            "$db" > "$root/background.json"
          grep -q '"protocol": "skein-background-maintenance-report"' "$root/background.json"
          grep -q '"total_candidates": 4' "$root/background.json"
          grep -q '"kind": "search_projection_graph_delta"' "$root/background.json"
          grep -q '"kind": "skein_lightning_bootstrap_export"' "$root/background.json"
          grep -q '"priority": "background"' "$root/background.json"
          grep -q '"admission": "admit"' "$root/background.json"

      - name: Previous wrapper adapter smoke
        env:
          SKEIN_ENABLE_COMPATIBILITY_TOOLS: "1"
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cat > "$root/previous_wrapper.py" <<'PY'
          import json
          import sys

          for line in sys.stdin:
              request = json.loads(line)
              op = request.get("op")
              if op == "query":
                  print(json.dumps({"rows": [{"title": "Adapter Smoke"}]}), flush=True)
              elif op == "execute_session":
                  print(json.dumps({"results": [{"rows": [{"title": "Adapter Smoke"}]}]}), flush=True)
              elif op == "project_graph":
                  print(json.dumps({"ok": {
                      "node_count": 1,
                      "edge_count": 0,
                      "incoming": [],
                      "communities": [],
                      "hierarchical_communities": [],
                      "page_rank_scores": [[0, 1.0]],
                      "page_rank_top_node": 0,
                  }}), flush=True)
              else:
                  print(json.dumps({"error": {"class": "execution", "message": f"unsupported op {op}"}}), flush=True)
          PY
          cargo run --quiet --bin skein -- \
            external-shadow-adapter-smoke \
            --require-previous-wrapper \
            --shadow-trace "$root/adapter-shadow.jsonl" \
            previous-wrapper \
            cargo run --quiet --example nowledge_previous_wrapper_shadow_adapter -- \
              --persistent-command python3 -u "$root/previous_wrapper.py" \
            > "$root/adapter.json"
          grep -q '"protocol": "skein-external-shadow-adapter-smoke"' "$root/adapter.json"
          grep -q '"engine_kind": "previous_wrapper"' "$root/adapter.json"
          grep -q '"wrapper_identity": null' "$root/adapter.json"
          grep -q '"adapter_smoke_ready": true' "$root/adapter.json"
          grep -q '"matched_checks": 2' "$root/adapter.json"
          grep -q '"primary_only_checks": 0' "$root/adapter.json"
          grep -q '"request_count": 4' "$root/adapter.json"
          test -s "$root/adapter-shadow.jsonl"

      - name: Migration gate smoke
        env:
          SKEIN_ENABLE_COMPATIBILITY_TOOLS: "1"
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          TMPDIR="$root" cargo run --quiet --bin skein -- > "$root/demo.out"
          db="$root/skein-demo"
          cargo run --quiet --bin skein -- \
            storage-recovery-report \
            --max-wal-replay-entries 100 \
            --require-durable \
            --require-checkpoint-boundary \
            --require-bounded-wal-replay \
            --require-clean-tail \
            "$db" > "$root/recovery.json"
          cargo run --quiet --bin skein -- \
            background-maintenance-report \
            --require-cutover-ready \
            "$db" > "$root/background.json"
          cat > "$root/previous-wrapper-contract-evidence.json" <<'JSON'
          {
            "ready": true,
            "evidence_kind": "previous_wrapper_contract",
            "wrapper_identity": "nowledge-previous-wrapper:ci-smoke",
            "requires_full_contract_ready": true,
            "requires_wrapper_identity": true,
            "blocker_codes": [],
            "blockers": []
          }
          JSON
          cat > "$root/contract-evidence.json" <<'JSON'
          {
            "required_contract_ready": true,
            "full_contract_checked": true,
            "full_contract_ready": true,
            "selected_checks": 2,
            "check_count": 2,
            "required_contract_blocker_codes": [],
            "previous_wrapper_contract_evidence": {
              "ready": true,
              "evidence_kind": "previous_wrapper_contract",
              "wrapper_identity": "nowledge-previous-wrapper:ci-smoke",
              "requires_full_contract_ready": true,
              "requires_wrapper_identity": true,
              "blocker_codes": [],
              "blockers": []
            }
          }
          JSON
          cat > "$root/adapter-smoke.json" <<'JSON'
          {
            "adapter_smoke_ready": true,
            "engine_kind": "previous_wrapper",
            "wrapper_identity": "nowledge-previous-wrapper:ci-smoke",
            "primary_only_checks": 0,
            "dual_engine_evidence": {
              "ready": false,
              "primary_check_count": 2,
              "shadow_check_count": 2,
              "matched_check_count": 1,
              "primary_only_check_count": 1
            },
            "blocker_codes": []
          }
          JSON
          cat > "$root/query-runtime-preflight.json" <<'JSON'
          {
            "protocol": "skein-nowledge-query-runtime-preflight-v1",
            "ready": true,
            "database_opened": true,
            "probe_count": 1,
            "passed_probe_count": 1,
            "failed_probe_count": 0,
            "required_route_count": 1,
            "covered_route_count": 1,
            "covered_routes": ["/memories/{id}"],
            "missing_required_routes": [],
            "required_routes_covered": true,
            "unknown_routes": [],
            "duplicate_routes": [],
            "route_coverage_ready": true,
            "route_coverage_blocker_codes": [],
            "blocker_codes": [],
            "failed_checks": [],
            "probes": [
              {
                "name": "probe:/memories/{id}",
                "route": "/memories/{id}",
                "query_family": "memory_lookup",
                "ready": true,
                "success": true,
                "output_row_count": 1,
                "selected_plan_fingerprint": "ProjectExec(IndexNodeSeek)",
                "selected_plan_operator_counts": {
                  "IndexNodeSeek": 1,
                  "ProjectExec": 1
                },
                "selected_plan_class_counts": {
                  "access": 1,
                  "relational": 1
                },
                "optimizer_decision_count": 2,
                "plan_cache_lookup": "miss",
                "plan_cache": {
                  "lookup": "miss",
                  "bypass_reason": null,
                  "cacheable": true,
                  "hit": false,
                  "miss": true,
                  "bypassed": false
                },
                "execution_profile": {
                  "scan_pruning_report_count": 1,
                  "pruned_scan_count": 1,
                  "scan_pruning_reports": [
                    {
                      "label_id": 1,
                      "strategy": {
                        "kind": "property_eq",
                        "property": "id"
                      },
                      "pruned": true,
                      "exact_empty": false,
                      "candidate_count_before_pruning": 2,
                      "pruned_candidate_count": 1,
                      "candidate_count_before_filter": 1,
                      "output_count": 1,
                      "filtered_out_count": 0
                    }
                  ]
                },
                "blocker_codes": []
              }
            ]
          }
          JSON
          python3 - "$root/query-runtime-preflight.json" <<'PY'
          import copy
          import json
          import sys

          routes = [
              "/graph/overview",
              "/graph/explore",
              "/graph/expand/{node_id}",
              "/graph/live-preview",
              "/graph/live-preview/{node_id}",
              "/graph/community-members/{community_id}",
              "/library/community/{community_id}/subgraph",
              "/library/community/{community_id}/recent-memories",
              "/library/community/{community_id}/related",
              "/graph/analysis",
              "/graph/augmentation/state",
              "/graph/augmentation/pagerank/plan",
              "/graph/node-details/{node_id}",
              "/graph/orphans",
              "/graph/shortest-path",
          ]

          with open(sys.argv[1], encoding="utf-8") as file:
              report = json.load(file)

          probe_template = report["probes"][0]
          probes = []
          for route in routes:
              probe = copy.deepcopy(probe_template)
              probe["name"] = f"probe:{route}"
              probe["route"] = route
              probes.append(probe)

          report["probe_count"] = len(routes)
          report["passed_probe_count"] = len(routes)
          report["failed_probe_count"] = 0
          report["required_route_count"] = len(routes)
          report["covered_route_count"] = len(routes)
          report["covered_routes"] = routes
          report["probes"] = probes

          with open(sys.argv[1], "w", encoding="utf-8") as file:
              json.dump(report, file)
          PY
          cat > "$root/library-readiness.json" <<'JSON'
          {
            "protocol": "skein-nowledge-mem-library-readiness-v1",
            "present": true,
            "ready": true,
            "mode": "shadow_read_only",
            "ready_area_count": 7,
            "blocked_area_count": 0,
            "blocker_codes": [],
            "open_report": {
              "protocol": "skein-nowledge-mem-open-report",
              "mode": "shadow_read_only",
              "graph_opened": true,
              "search_projection_opened": true
            },
            "readiness_by_area": {
              "graph": {
                "ready": true,
                "blocker_codes": []
              },
              "query": {
                "ready": true,
                "blocker_codes": []
              },
              "storage": {
                "ready": true,
                "blocker_codes": []
              },
              "background": {
                "ready": true,
                "blocker_codes": []
              },
              "query_family": {
                "ready": true,
                "blocker_codes": []
              },
              "search_projection": {
                "ready": true,
                "blocker_codes": []
              },
              "search_projection_shadow": {
                "ready": true,
                "blocker_codes": []
              }
            }
          }
          JSON
          cat > "$root/cutover-controls.json" <<'JSON'
          {
            "protocol": "skein-nowledge-mem-cutover-controls-v1",
            "ready": true,
            "controls": {
              "graph_reads": "skein",
              "search_reads": "skein",
              "dual_writes": "enabled",
              "initial_import": "disabled",
              "projection_catch_up": "enabled"
            },
            "graph": {
              "read_selected_skein": true,
              "read_effective": true
            },
            "search": {
              "read_selected_skein": true,
              "read_effective": true
            },
            "work": {
              "dual_writes_enabled": true,
              "initial_import_enabled": false,
              "initial_import_inactive_for_cutover": true,
              "initial_import_cutover_catch_up_ready": false,
              "initial_import_safe_for_read_cutover": true,
              "projection_catch_up_enabled": true
            },
            "production_status": {
              "graph": {
                "skein_cutover_effective": true
              },
              "search": {
                "skein_cutover_effective": true
              }
            },
            "redaction": {
              "query_text_copied": false,
              "parameters_copied": false,
              "local_paths_copied": false
            },
            "blocker_codes": []
          }
          JSON
          cat > "$root/operations-readiness.json" <<'JSON'
          {
            "protocol": "skein-nowledge-mem-operations-readiness-v1",
            "present": true,
            "ready": true,
            "mode": "writable_cutover",
            "graph": {
              "open": true,
              "read_only": false,
              "commit_epoch": 42
            },
            "search_projection": {
              "open": true,
              "commit_lag": 0,
              "stale": false
            },
            "storage_lifecycle": {
              "ready": true,
              "action": "ready"
            },
            "readiness": {
              "storage_lifecycle_ready": true,
              "storage_recovery_ready": true,
              "slow_query_ready": true,
              "background_maintenance_ready": true
            },
            "redaction": {
              "query_text_copied": false,
              "parameters_copied": false,
              "local_paths_copied": false
            },
            "blocker_codes": []
          }
          JSON
          mkdir -p "$root/crates/nmem-graph/src"
          cat > "$root/crates/nmem-graph/src/repo.rs" <<'RS'
          pub fn query() -> &'static str {
              "MATCH (m:Memory) WHERE m.id = $id RETURN m.title AS title"
          }
          RS
          cargo run --quiet --bin skein -- \
            nowledge-cypher-migration-gate \
            --require-ready \
            --allow-self-shadow \
            --shadow-ready \
            --shadow-trace "$root/shadow.jsonl" \
            --require-storage-recovery-evidence \
            --storage-recovery-report-json "$root/recovery.json" \
            --require-background-maintenance-evidence \
            --background-maintenance-report-json "$root/background.json" \
            --previous-wrapper-contract-evidence-json "$root/previous-wrapper-contract-evidence.json" \
            "$root" \
            self \
            cargo run --quiet --bin skein-shadow-self -- \
            > "$root/migration-gate.json"
          grep -q '"decision": "ready"' "$root/migration-gate.json"
          grep -q '"shadow_run"' "$root/migration-gate.json"
          grep -q '"evidence_kind": "protocol_smoke"' "$root/migration-gate.json"
          grep -q '"self_shadow": true' "$root/migration-gate.json"
          grep -q '"cutover_evidence"' "$root/migration-gate.json"
          grep -q '"eligible": false' "$root/migration-gate.json"
          grep -q '"storage_recovery_present": true' "$root/migration-gate.json"
          grep -q '"storage_recovery_ready": true' "$root/migration-gate.json"
          grep -q '"storage_recovery_protocol_matches": true' "$root/migration-gate.json"
          grep -q '"background_maintenance_present": true' "$root/migration-gate.json"
          grep -q '"background_maintenance_ready": true' "$root/migration-gate.json"
          grep -q '"background_maintenance_protocol_matches": true' "$root/migration-gate.json"
          grep -q '"previous_wrapper_contract_evidence"' "$root/migration-gate.json"
          grep -q '"wrapper_identity": "nowledge-previous-wrapper:ci-smoke"' "$root/migration-gate.json"
          grep -q '"shadow_ready"' "$root/migration-gate.json"
          grep -q '"shadow_trace"' "$root/migration-gate.json"
          grep -q '"request_count"' "$root/migration-gate.json"
          grep -q '"project_graph"' "$root/migration-gate.json"
          test -s "$root/shadow.jsonl"
          if cargo run --quiet --bin skein -- \
            nowledge-replacement-summary \
            --require-production-ready \
            "$root/migration-gate.json" \
            > "$root/replacement-summary.json" 2> "$root/replacement.err"; then
            echo "expected protocol smoke replacement summary to fail production readiness"
            exit 1
          fi
          grep -q '"production_cutover_ready": false' "$root/replacement-summary.json"
          grep -q '"production_replacement_per_million": 0' "$root/replacement-summary.json"
          grep -q '"cutover_evidence"' "$root/replacement-summary.json"
          grep -q '"shadow_evidence"' "$root/replacement-summary.json"
          grep -q '"previous_wrapper_contract_evidence"' "$root/replacement-summary.json"
          grep -q '"wrapper_identity": "nowledge-previous-wrapper:ci-smoke"' "$root/replacement-summary.json"
          grep -q "nowledge replacement summary is not production cutover ready" "$root/replacement.err"
          cargo run --quiet --bin skein -- \
            nowledge-previous-wrapper-preflight-check \
            --wrapper-identity "nowledge-previous-wrapper:ci-smoke" \
            --bundle-dir "$root" \
            > "$root/preflight.json"
          grep -q '"protocol": "skein-nowledge-previous-wrapper-preflight-check"' "$root/preflight.json"
          grep -q '"ready": false' "$root/preflight.json"
          grep -q '"migration_gate"' "$root/preflight.json"
          grep -q '"replacement_summary"' "$root/preflight.json"
          grep -q '"release_summary"' "$root/preflight.json"
          grep -q '"production_replacement_per_million": 0' "$root/preflight.json"
          python3 - "$root/preflight.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              report = json.load(file)

          checks = {check["name"]: check for check in report["checks"]}
          assert checks["storage_recovery"]["ready"] is True
          assert checks["background_maintenance"]["ready"] is True
          assert report["failed_checks"] == [
              "adapter_smoke",
              "migration_gate",
              "replacement_summary",
              "replacement_summary_route_catalog",
              "replacement_summary_graph_route",
              "replacement_summary_bounded_read",
              "query_runtime_preflight",
              "library_readiness",
          ]
          assert checks["adapter_smoke"]["failed_evidence_fields"] == [
              "dual_engine_evidence.ready",
              "dual_engine_evidence.matched_check_count",
              "dual_engine_evidence.primary_only_check_count",
          ]
          assert report["release_summary"]["wrapper_identity"] == "nowledge-previous-wrapper:ci-smoke"
          assert report["release_summary"]["adapter_dual_engine_ready"] is False
          assert report["release_summary"]["adapter_dual_engine_counts_consistent"] is False
          assert report["release_summary"]["adapter_dual_engine_primary_only_check_count"] == 1
          assert report["release_summary"]["production_replacement_per_million"] == 0
          assert report["release_summary"]["shadow_evidence_ready"] is False
          assert report["release_summary"]["background_maintenance_executable_search_projection_graph_delta_count"] >= 0
          assert report["release_summary"]["background_maintenance_admitted_search_projection_graph_delta_count"] >= 0
          PY
          if cargo run --quiet --bin skein -- \
            nowledge-previous-wrapper-preflight-check \
            --require-ready \
            --wrapper-identity "nowledge-previous-wrapper:ci-smoke" \
            --bundle-dir "$root" \
            > "$root/preflight-required.json" 2> "$root/preflight-required.err"; then
            echo "expected protocol smoke preflight bundle to fail readiness"
            exit 1
          fi
          grep -q '"ready": false' "$root/preflight-required.json"
          grep -q "nowledge previous-wrapper preflight is not ready" "$root/preflight-required.err"

      - name: Migration gate blocked smoke
        env:
          SKEIN_ENABLE_COMPATIBILITY_TOOLS: "1"
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/crates/nmem-graph/src"
          cat > "$root/crates/nmem-graph/src/repo.rs" <<'RS'
          pub fn query() -> &'static str {
              "MATCH (m:Memory) WHERE m.id = $id RETURN m.uncovered_property"
          }
          RS
          if cargo run --quiet --bin skein -- \
            nowledge-cypher-migration-gate \
            --require-ready \
            --allow-self-shadow \
            "$root" \
            self \
            cargo run --quiet --bin skein-shadow-self -- \
            > "$root/gate.json" 2> "$root/gate.err"; then
            echo "expected blocked migration gate to fail"
            exit 1
          fi
          grep -q '"decision": "blocked"' "$root/gate.json"
          grep -q '"shadow_run"' "$root/gate.json"
          grep -q '"evidence_kind": "protocol_smoke"' "$root/gate.json"
          grep -q '"cutover_evidence"' "$root/gate.json"
          grep -q '"eligible": false' "$root/gate.json"
          grep -q '"shadow_ready"' "$root/gate.json"
          grep -q "nowledge migration gate is blocked" "$root/gate.err"

  runtime-platform:
    name: Runtime Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Check Tokio facade
        run: cargo check -p skein --features tokio-runtime

      - name: Check qualification workload
        run: cargo check -p skein-qualification

      - name: Test resource detection
        run: cargo test -p skein-qos resource::tests

      - name: Test cgroup v2 detection
        run: cargo test -p skein-cgroup

      - name: Test expression IR
        run: cargo test -p skein-expression

      - name: Test telemetry contract
        run: cargo test -p skein-telemetry

      - name: Test process memory metrics
        run: cargo test -p skein-qos process_memory::tests

      - name: Test Tokio adapter
        run: cargo test -p skein-runtime-tokio

  vector-projection-platform:
    name: Vector Projection (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Check default and minimal feature sets
        run: |
          cargo check -p skein
          cargo check -p skein --no-default-features

      - name: Test TurboQuant projection
        run: cargo test -p skein-vector-projection

      - name: Test embedded TurboQuant facade
        run: cargo test -p skein --lib search::turboquant_projection::tests

      - name: Test vector qualification protocol
        run: cargo test -p skein-qualification production_vector

      - name: Install upstream oracle native dependency
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev

      - name: Test upstream differential oracle
        if: matrix.target == 'linux-x86_64'
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: cargo test -p skein-qualification production_vector --features turbovec-oracle

  storage-platform:
    name: Storage Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Test storage artifacts and ownership
        run: cargo test -p skein-storage

      - name: Test durable storage recovery
        run: cargo test -p skein --features acl --lib api::tests::storage_recovery

      - name: Test out-of-core search projection I/O
        run: cargo test -p skein --features acl --lib search::out_of_core::tests

      - name: Capture Windows storage lifecycle evidence
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SKEIN_TEST_RUST_TOOLCHAIN: "1.97.1"
          SKEIN_TEST_STORAGE_RESOURCE_EVIDENCE_PATH: storage-resource-results/report.json
        run: |
          set -euo pipefail
          mkdir -p storage-resource-results
          set +e
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::platform_storage_resource_profile_emits_bound_evidence \
            -- --exact --nocapture 2>&1 \
            | tee storage-resource-results/resource-profile-test-output.txt
          resource_status=${PIPESTATUS[0]}
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::canonical_row_overflow_backup_reopen_and_reclaim_follow_physical_closure \
            -- --exact --nocapture 2>&1 \
            | tee storage-resource-results/row-overflow-lifecycle-test-output.txt
          lifecycle_status=${PIPESTATUS[0]}
          set -e
          printf '{"protocol":"skein-windows-storage-lifecycle-evidence-v1","source_revision":"%s","runner_os":"%s","resource_profile_test_status":%s,"row_overflow_lifecycle_test_status":%s}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$resource_status" "$lifecycle_status" \
            > storage-resource-results/manifest.json
          test "$resource_status" -eq 0
          test "$lifecycle_status" -eq 0

      - name: Upload Windows storage lifecycle evidence
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: storage-resource-windows-latest-${{ github.sha }}
          path: storage-resource-results
          if-no-files-found: error

  concurrency-model:
    name: Concurrency Model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Loom plan cache model
        run: cargo test -p skein-plan-cache --features loom-tests loom_tests

      - name: Loom QoS scheduler model
        run: cargo test -p skein-qos --features loom-tests loom_tests

      - name: Loom slow query ring model
        run: cargo test -p skein --features loom-tests api::system_sql::loom_tests

  storage-crash-recovery:
    name: Storage Crash Recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run subprocess crash matrix
        shell: bash
        env:
          SKEIN_TEST_RUST_TOOLCHAIN: "1.97.1"
          SKEIN_TEST_STORAGE_CRASH_EVIDENCE_PATH: storage-crash-results/report.json
        run: |
          set -o pipefail
          mkdir -p storage-crash-results
          set +e
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::subprocess_crash_matrix_recovers_whole_batches_and_artifact_generations \
            -- --nocapture 2>&1 | tee storage-crash-results/test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          printf '{"source_revision":"%s","runner_os":"%s","test_status":%s}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$test_status" \
            > storage-crash-results/manifest.json
          exit "$test_status"

      - name: Upload crash recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-crash-recovery-${{ matrix.os }}-${{ github.sha }}
          path: storage-crash-results
          if-no-files-found: error

  tla-model-check:
    name: TLA Model Check
    needs: storage-formal-models
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download storage model-check evidence
        uses: actions/download-artifact@v4
        with:
          name: tla-model-check-${{ github.sha }}
          path: tla-results

      - name: Verify complete storage model-check evidence
        run: scripts/check-storage-tla.sh --verify-results tla-results "$GITHUB_SHA"
