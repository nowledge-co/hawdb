name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check advisories licenses

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check scripts
        run: |
          bash -n scripts/nowledge-previous-wrapper-preflight.sh
          bash -n scripts/check-storage-tla.sh
          test "$(scripts/check-storage-tla.sh --manifest-json 4ebf76c | jq -r .source_revision)" = "4ebf76c"

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  storage-formal-models:
    name: Storage Formal Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-storage-tla

      - name: Check storage TLA+ models with Bazel
        # Each TLC process already parallelizes internally. Serial Bazel action
        # scheduling prevents a runner from multiplying that worker count by
        # the number of models in the suite.
        run: bazel test //docs/tla:storage_models --jobs=1 --test_output=errors

      - name: Check storage TLA+ negative controls
        run: scripts/check-storage-tla.sh --check-mutants

      # rules_tla is the authoritative model-check gate. The release artifact
      # collector repeats the bounded checks only because the published
      # evidence contract retains complete TLC logs, while rules_tla 0.2.0
      # exposes a success marker but not the action log as a declared output.
      - name: Collect storage model-check evidence
        env:
          TLA_RESULTS_DIR: ${{ github.workspace }}/tla-results
          TLA_SOURCE_REVISION: ${{ github.sha }}
        run: scripts/check-storage-tla.sh

      - name: Upload storage model-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-model-check-${{ github.sha }}
          path: tla-results
          if-no-files-found: error

  runtime-platform:
    name: Runtime Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux coverage is authoritative in the Prow Bazel build and crate-test jobs.
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Check Tokio facade
        run: cargo check -p skein --features tokio-runtime

      - name: Check qualification workload
        run: cargo check -p skein-qualification

      - name: Test resource detection
        run: cargo test -p skein-qos resource::tests

      - name: Test cgroup v2 detection
        run: cargo test -p skein-cgroup

      - name: Test expression IR
        run: cargo test -p skein-expression

      - name: Test telemetry contract
        run: cargo test -p skein-telemetry

      - name: Test process memory metrics
        run: cargo test -p skein-qos process_memory::tests

      - name: Test Tokio adapter
        run: cargo test -p skein-runtime-tokio

  vector-projection-platform:
    name: Vector Projection (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Check default and minimal feature sets
        run: |
          cargo check -p skein
          cargo check -p skein --no-default-features

      - name: Test TurboQuant projection
        run: cargo test -p skein-vector-projection

      - name: Test embedded TurboQuant facade
        run: cargo test -p skein --lib search::turboquant_projection::tests

      - name: Test vector qualification protocol
        run: cargo test -p skein-qualification production_vector

      - name: Install upstream oracle native dependency
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev

      - name: Test upstream differential oracle
        if: matrix.target == 'linux-x86_64'
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: cargo test -p skein-qualification production_vector --features turbovec-oracle

  storage-platform:
    name: Storage Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Test storage artifacts and ownership
        run: cargo test -p skein-storage

      - name: Test durable storage recovery
        run: cargo test -p skein --features acl --lib api::tests::storage_recovery

      - name: Test out-of-core search projection I/O
        run: cargo test -p skein --features acl --lib search::out_of_core::tests

      - name: Capture Windows storage lifecycle evidence
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SKEIN_TEST_RUST_TOOLCHAIN: "1.97.1"
          SKEIN_TEST_STORAGE_RESOURCE_EVIDENCE_PATH: storage-resource-results/report.json
        run: |
          set -euo pipefail
          mkdir -p storage-resource-results
          set +e
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::platform_storage_resource_profile_emits_bound_evidence \
            -- --exact --nocapture 2>&1 \
            | tee storage-resource-results/resource-profile-test-output.txt
          resource_status=${PIPESTATUS[0]}
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::canonical_row_overflow_backup_reopen_and_reclaim_follow_physical_closure \
            -- --exact --nocapture 2>&1 \
            | tee storage-resource-results/row-overflow-lifecycle-test-output.txt
          lifecycle_status=${PIPESTATUS[0]}
          set -e
          printf '{"protocol":"skein-windows-storage-lifecycle-evidence-v1","source_revision":"%s","runner_os":"%s","resource_profile_test_status":%s,"row_overflow_lifecycle_test_status":%s}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$resource_status" "$lifecycle_status" \
            > storage-resource-results/manifest.json
          test "$resource_status" -eq 0
          test "$lifecycle_status" -eq 0

      - name: Upload Windows storage lifecycle evidence
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: storage-resource-windows-latest-${{ github.sha }}
          path: storage-resource-results
          if-no-files-found: error

  storage-crash-recovery:
    name: Storage Crash Recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run subprocess crash matrix
        shell: bash
        env:
          SKEIN_TEST_RUST_TOOLCHAIN: "1.97.1"
          SKEIN_TEST_STORAGE_CRASH_EVIDENCE_PATH: storage-crash-results/report.json
        run: |
          set -o pipefail
          mkdir -p storage-crash-results
          set +e
          cargo test -p skein --features acl --lib \
            api::tests::storage_recovery::subprocess_crash_matrix_recovers_whole_batches_and_artifact_generations \
            -- --nocapture 2>&1 | tee storage-crash-results/test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          printf '{"source_revision":"%s","runner_os":"%s","test_status":%s}\n' \
            "$GITHUB_SHA" "$RUNNER_OS" "$test_status" \
            > storage-crash-results/manifest.json
          exit "$test_status"

      - name: Upload crash recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-crash-recovery-${{ matrix.os }}-${{ github.sha }}
          path: storage-crash-results
          if-no-files-found: error

  tla-model-check:
    name: TLA Model Check
    needs: storage-formal-models
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download storage model-check evidence
        uses: actions/download-artifact@v4
        with:
          name: tla-model-check-${{ github.sha }}
          path: tla-results

      - name: Verify complete storage model-check evidence
        run: scripts/check-storage-tla.sh --verify-results tla-results "$GITHUB_SHA"
