name: Scheduled Quality

on:
  schedule:
    - cron: "17 2 * * 6"
  workflow_dispatch:
    inputs:
      fuzz_cases:
        description: Cases per deterministic optimizer fuzz seed
        required: false
        default: "4096"
      storage_fuzz_cases:
        description: Cases per deterministic persistent-format fuzz seed
        required: false
        default: "512"
      soak_node_count:
        description: Synthetic nodes in the mixed runtime soak
        required: false
        default: "4096"
      soak_payload_bytes:
        description: Payload bytes per synthetic soak node
        required: false
        default: "4096"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain Refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check current advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check advisories licenses

  optimizer-fuzz:
    name: Optimizer Differential And Metamorphic Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SKEIN_FUZZ_CASES: ${{ inputs.fuzz_cases || '4096' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run deterministic campaigns
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/fuzz
          campaign_status=0
          for seed in 7 104729 4294967291; do
            report="artifacts/fuzz/campaign-${seed}.json"
            if ! cargo run --release -p skein-fuzz --quiet -- \
              --seed "$seed" \
              --cases "$SKEIN_FUZZ_CASES" \
              > "$report"; then
              campaign_status=1
            fi
            if ! jq -e \
              '.protocol == "skein-multi-oracle-fuzz-v3" and
               .executed_case_count == .requested_case_count and
               .complete_shape_coverage == true and
               .success == true' \
              "$report" > /dev/null; then
              campaign_status=1
            fi
            jq '{
              protocol,
              seed,
              failed_case_count,
              failures: [
                .cases[]
                | select(.success == false)
                | {
                    index,
                    seed,
                    shape,
                    graph_tlp_shape,
                    reproduction_command,
                    failure,
                    graph_tlp_failure,
                    metamorphic_failure
                  }
              ]
            }' "$report" > "artifacts/fuzz/replay-${seed}.json"
          done
          jq -n \
            --arg protocol "skein-scheduled-fuzz-manifest-v1" \
            --arg revision "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg cases_per_seed "$SKEIN_FUZZ_CASES" \
            --argjson seeds '[7, 104729, 4294967291]' \
            '{
              protocol: $protocol,
              revision: $revision,
              run_id: $run_id,
              run_attempt: $run_attempt,
              cases_per_seed: ($cases_per_seed | tonumber),
              seeds: $seeds
            }' > artifacts/fuzz/manifest.json
          exit "$campaign_status"

      - name: Retain campaign and minimized replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-fuzz-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/fuzz
          if-no-files-found: error
          retention-days: 30

      - name: Enforce campaign result
        if: always()
        shell: bash
        run: test "${{ steps.fuzz.outcome }}" = "success"

  storage-parser-fuzz:
    name: Storage And Search Persistent Format Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKEIN_STORAGE_FUZZ_CASES: ${{ inputs.storage_fuzz_cases || '512' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run deterministic corruption campaigns
        id: storage_fuzz
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/storage-fuzz
          campaign_status=0
          for seed in 7 104729 4294967291; do
            report="artifacts/storage-fuzz/campaign-${seed}.json"
            if ! cargo run --release -p skein-fuzz --bin skein-storage-fuzz --quiet -- \
              --seed "$seed" \
              --cases "$SKEIN_STORAGE_FUZZ_CASES" \
              > "$report"; then
              campaign_status=1
            fi
            if ! jq -e \
              --argjson cases "$SKEIN_STORAGE_FUZZ_CASES" \
              '.protocol == "skein-storage-parser-fuzz-v1" and
               .requested_case_count == $cases and
               .failed_case_count == 0 and
               .success == true' \
              "$report" > /dev/null; then
              campaign_status=1
            fi
          done
          jq -n \
            --arg protocol "skein-scheduled-storage-fuzz-manifest-v1" \
            --arg revision "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg cases_per_seed "$SKEIN_STORAGE_FUZZ_CASES" \
            --argjson seeds '[7, 104729, 4294967291]' \
            '{
              protocol: $protocol,
              revision: $revision,
              run_id: $run_id,
              run_attempt: $run_attempt,
              cases_per_seed: ($cases_per_seed | tonumber),
              seeds: $seeds
            }' > artifacts/storage-fuzz/manifest.json
          exit "$campaign_status"

      - name: Retain corruption reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-parser-fuzz-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/storage-fuzz
          if-no-files-found: error
          retention-days: 30

      - name: Enforce corruption campaign result
        if: always()
        shell: bash
        run: test "${{ steps.storage_fuzz.outcome }}" = "success"

  vector-kernel-sanitizer:
    name: Vector Kernel Address Sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust with standard library sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run scalar and SIMD differential corpus under ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test -p skein-vector-projection
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          kernel::tests

  mixed-runtime-soak:
    name: Larger Than Memory Mixed Runtime Soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SKEIN_SOAK_NODE_COUNT: ${{ inputs.soak_node_count || '4096' }}
      SKEIN_SOAK_PAYLOAD_BYTES: ${{ inputs.soak_payload_bytes || '4096' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run admitted mixed workload
        id: soak
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/soak
          database_root="$(mktemp -d)"
          soak_status=0
          if ! cargo run --release -p skein-qualification --bin skein-soak --quiet -- \
            --path "$database_root/database" \
            --revision "$GITHUB_SHA" \
            --dataset-id "scheduled-synthetic-v1" \
            --node-count "$SKEIN_SOAK_NODE_COUNT" \
            --payload-bytes "$SKEIN_SOAK_PAYLOAD_BYTES" \
            > artifacts/soak/report.json \
            2> artifacts/soak/run.log; then
            soak_status=1
          fi
          if ! jq -e \
            --arg revision "$GITHUB_SHA" \
            '.protocol == "skein-mixed-runtime-soak-v1" and
             .evidence_kind == "synthetic_scheduled_soak" and
             .fixture_setup_path == "controlled_raw_fixture" and
             .production_eligible == false and
             .identity.source_revision == $revision and
             .identity.dataset_id == "scheduled-synthetic-v1" and
             (.identity.dataset_fingerprint | startswith("sha256:")) and
             (.identity.configuration_digest | startswith("sha256:")) and
             .identity.graph_commit_epoch > 0 and
             .identity.workload == "foreground-point-read+background-distinct-cartesian+background-checkpoint-v2" and
             .ready == true and
             .storage.out_of_core == true and
             .storage.raw_dataset_exceeds_runtime_memory == true and
             .storage.canonical_exceeds_cache == true and
             .background.spilled_bytes > 0 and
             .background.spill_run_count > 0 and
             .checkpoint.completed == true and
             .checkpoint.canonical_generation_advanced == true and
             .runtime.final_admitted_memory_bytes == 0 and
             .runtime.final_overcommitted == false' \
            artifacts/soak/report.json > /dev/null; then
            soak_status=1
          fi
          exit "$soak_status"

      - name: Retain typed soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-runtime-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/soak
          if-no-files-found: error
          retention-days: 30

      - name: Enforce soak result
        if: always()
        shell: bash
        run: test "${{ steps.soak.outcome }}" = "success"
