name: Race Test

on:
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/race.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  thread-sanitizer:
    name: ThreadSanitizer Concurrent Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nightly Rust with standard library sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run the concurrent race regression under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          CARGO_BUILD_JOBS: "2"
        run: >-
          cargo +nightly test -p hawdb
          --features tokio-runtime
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --lib
          api::tests::race::
