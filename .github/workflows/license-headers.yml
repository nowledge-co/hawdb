name: License Headers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    name: Apache license headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        with:
          # Keep the CLI aligned with the pinned prek hook.
          tool: hawkeye@7.2.0

      - name: Test license header policy
        run: python3 scripts/check-license-headers.test.py

      - name: Check repository license headers
        # The wrapper accepts both full Apache headers and canonical SPDX headers.
        run: python3 scripts/check-license-headers.py .
