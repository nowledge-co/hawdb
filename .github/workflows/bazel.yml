name: Bazel

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bazel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          profile: minimal

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-build

      - name: Check Cargo and Bazel package parity
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_members[] as $member | .packages[] | select(.id == $member) | .manifest_path' \
            | while IFS= read -r manifest; do
                package_dir="$(dirname "$manifest")"
                if [[ ! -f "$package_dir/BUILD.bazel" ]]; then
                  echo "missing BUILD.bazel for Cargo workspace package: $package_dir"
                  exit 1
                fi
                if ! grep -Eq '^[[:space:]]*rust_test\(' "$package_dir/BUILD.bazel"; then
                  echo "missing rust_test target for Cargo workspace package: $package_dir"
                  exit 1
                fi
              done

      - name: Build
        run: bazel build //:skein

  test-root:
    name: Bazel Test (Root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          profile: minimal

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-test-root

      - name: Test
        run: >-
          bazel test --test_output=errors
          //:skein_unit_tests
          //:skein_cli_tests
          //:skein_shadow_self_tests

  test-crates:
    name: Bazel Test (Crates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          profile: minimal

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-test-crates

      - name: Test
        run: |
          bazel test --test_output=errors \
            //crates/api-types:skein_api_types_tests \
            //crates/core:skein_core_tests \
            //crates/cypher:skein_cypher_tests \
            //crates/ddl:skein_ddl_tests \
            //crates/executor:skein_executor_tests \
            //crates/expression:skein_expression_tests \
            //crates/fuzz:skein_fuzz_cli_tests \
            //crates/fuzz:skein_fuzz_tests \
            //crates/cgroup:skein_cgroup_tests \
            //crates/optimizer:planner_golden_test \
            //crates/optimizer:skein_optimizer_tests \
            //crates/plan-cache:skein_plan_cache_tests \
            //crates/plan:skein_plan_tests \
            //crates/qos:skein_qos_tests \
            //crates/query:skein_query_tests \
            //crates/qualification:skein_qualification_tests \
            //crates/qualification:skein_soak_cli_tests \
            //crates/readiness:skein_readiness_tests \
            //crates/route-ownership:skein_route_ownership_tests \
            //crates/runtime-tokio:skein_runtime_tokio_tests \
            //crates/sql:skein_sql_tests \
            //crates/storage:skein_storage_tests \
            //crates/telemetry:skein_telemetry_tests \
            //crates/vector-projection:skein_vector_projection_tests
