# Prow owns the shared build and test targets. Keep only GitHub-only checks here.
name: Bazel Coverage Gaps

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-parity:
    name: Cargo/Bazel Package Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          profile: minimal

      - name: Check Cargo and Bazel package parity
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_members[] as $member | .packages[] | select(.id == $member) | .manifest_path' \
            | while IFS= read -r manifest; do
                package_dir="$(dirname "$manifest")"
                if [[ ! -f "$package_dir/BUILD.bazel" ]]; then
                  echo "missing BUILD.bazel for Cargo workspace package: $package_dir"
                  exit 1
                fi
                if ! grep -Eq '^[[:space:]]*rust_test\(' "$package_dir/BUILD.bazel"; then
                  echo "missing rust_test target for Cargo workspace package: $package_dir"
                  exit 1
                fi
              done

  qualification-cli:
    name: Bazel Qualification CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          profile: minimal

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: false
          disk-cache: bazel-qualification-cli

      - name: Test
        run: |
          bazel test --test_output=errors \
            //crates/qualification:skein_content_store_memory_qualification_cli_tests \
            //crates/qualification:skein_content_store_mutation_qualification_cli_tests \
            //crates/qualification:skein_content_store_read_qualification_cli_tests \
            //crates/qualification:skein_graph_index_qualification_cli_tests \
            //crates/qualification:skein_graph_storage_qualification_cli_tests
