[package]
name = "shiro"
default-run = "shiro"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Local SQL and Cypher correctness fuzzing for HawDB"
repository = "https://github.com/nowledge-co/hawdb"
homepage = "https://hawdb.ai"
publish = false

[workspace]

[lib]
name = "shiro_core"

[dependencies]
serde_json = "1"
hawdb = { path = "../..", version = "0.21.0", default-features = false }
hawdb-fuzz-contracts = { path = "../../crates/fuzz-contracts", version = "0.21.0" }

[features]
default = [
    "background-maintenance",
    "full-text-search",
    "graph-analytics",
    "vector-search",
]
acl = ["hawdb/acl"]
background-maintenance = ["hawdb/background-maintenance"]
full-text-search = ["hawdb/full-text-search"]
graph-analytics = ["hawdb/graph-analytics"]
qualification = ["hawdb/qualification"]
vector-search = ["hawdb/vector-search"]

[[bin]]
name = "shiro"
path = "src/main.rs"

[[bin]]
name = "shiro-storage"
path = "src/storage_main.rs"

[[bin]]
name = "shiro-append"
path = "src/append_main.rs"

[[bin]]
name = "shiro-parser"
path = "src/parser_main.rs"
